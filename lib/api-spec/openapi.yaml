openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: business
    description: Business workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Business:
      type: object
      required: [id, name, industry, currency, cashBalanceCents, monthlyRevenueCents, monthlyExpensesCents, netProfitCents, assetsCents, liabilitiesCents, monthlyGrowthRateBps, activeCustomers, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        currency: { type: string }
        cashBalanceCents: { type: integer }
        monthlyRevenueCents: { type: integer }
        monthlyExpensesCents: { type: integer }
        netProfitCents: { type: integer }
        assetsCents: { type: integer }
        liabilitiesCents: { type: integer }
        monthlyGrowthRateBps: { type: integer }
        activeCustomers: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BusinessInput:
      type: object
      required: [name, currency, cashBalanceCents, monthlyRevenueCents, monthlyExpensesCents, netProfitCents, assetsCents, liabilitiesCents, monthlyGrowthRateBps, activeCustomers]
      properties:
        name: { type: string, minLength: 1 }
        industry: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        cashBalanceCents: { type: integer, minimum: 0 }
        monthlyRevenueCents: { type: integer, minimum: 0 }
        monthlyExpensesCents: { type: integer, minimum: 0 }
        netProfitCents: { type: integer }
        assetsCents: { type: integer, minimum: 0 }
        liabilitiesCents: { type: integer, minimum: 0 }
        monthlyGrowthRateBps: { type: integer, minimum: -10000, maximum: 100000 }
        activeCustomers: { type: integer, minimum: 0 }
    BusinessUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        industry: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        cashBalanceCents: { type: integer, minimum: 0 }
        monthlyRevenueCents: { type: integer, minimum: 0 }
        monthlyExpensesCents: { type: integer, minimum: 0 }
        netProfitCents: { type: integer }
        assetsCents: { type: integer, minimum: 0 }
        liabilitiesCents: { type: integer, minimum: 0 }
        monthlyGrowthRateBps: { type: integer, minimum: -10000, maximum: 100000 }
        activeCustomers: { type: integer, minimum: 0 }

